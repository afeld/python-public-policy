version: 1
project:
  id: f6e67d86-5ff0-4f42-ab5a-a421c82f8f9e
  title: "{{course_name}} @ {{school_name}}"
  authors:
    - name: Aidan Feldman
  plugins:
    - extras/myst/colab.mjs
  exclude:
    - .github/*
    - .pytest_cache/*
    - tmp/*
  github: afeld/python-public-policy
  # conditionals should match the files extras/scripts/school.sh removes
  toc:
    - file: index.md
    - file: syllabus.md
      children:
        - file: registration.md
        - file: joining_late.md
        - file: exam.md
        {% if id == "columbia" -%}
        - file: curve.ipynb
        {%- endif %}
    - file: resources.md
      children:
        - file: brackets.ipynb
          title: Brackets
    - title: Lectures
      children:
        - file: lecture_0.ipynb
        - file: lecture_1.ipynb
          children:
            - file: lecture_1_exercise.ipynb
              title: In-class exercise
            - file: lecture_1_exercise_solution.ipynb
              title: In-class exercise solution
            - file: lecture_1_demo_solution.ipynb
              title: Demo solution
        - file: lecture_2.ipynb
          children:
            - file: lecture_2_exercise.ipynb
              title: In-class exercise
            {% if id == "columbia" -%}
            - file: lecture_2_exercise_2_solution.ipynb
              title: Exercise 2 solution
            {%- endif %}
        - file: lecture_3.ipynb
          children:
            - file: lecture_3_exercise_solution.ipynb
              title: In-class exercise solution
            - file: lecture_3_demo_solution.ipynb
              title: Demo solution
        - file: lecture_4.ipynb
          children:
            - file: lecture_4_demo_solution.ipynb
              title: Demo solution
        - file: lecture_5.ipynb
          children:
            - file: lecture_5_exercise_solution.ipynb
              title: In-class exercise solution
        - file: lecture_6.ipynb
    - file: assignments.md
      title: Assignments
      children:
        - file: assignments/open_ended.md
        - file: hw_0.ipynb
        - file: hw_1.md
        - file: hw_2.ipynb
        - file: hw_3.ipynb
        - file: hw_4.md
        - file: final_project.md
          children:
            - file: final_project/proposal.md
              title: Proposal
            - file: final_project/resources.md
              title: Resources
            - file: final_project/peer_grading.md
              title: Peer grading
            - file: final_project/examples.md
              title: Examples
              children:
                - file: final_project/creepy_crawly.ipynb
                - file: final_project/lead.ipynb
                - file: final_project/universities.ipynb
    - title: Meta information
      children:
        - file: meta/assistant_guide.md
          children:
            - file: meta/ed_helper.ipynb
        - file: meta/instructor_guide.md
        {% if id == "nyu" -%}
        - title: Architecture Decision Records (ADRs)
          children:
            - file: meta/adrs/plotting.md
              title: Plotting
            - file: meta/adrs/submission.md
              title: Submission
        {%- endif %}
site:
  template: book-theme
  # external links, kept out of project.toc so they don't become section labels in the previous/next footer
  nav:
    - title: "{{lms_name}}"
      url: "{{lms_url}}"
    - title: Ed
      url: "{{discussions_url}}"
    - title: Gradescope
      url: "{{submission_tool_url}}"
  parts:
    # license badge, which links to the right URL, unlike the one from project.license
    footer: _footer.md
  options:
    folders: true
    # JB1 didn't show the author on each page
    hide_authors: true
    logo_text: "{{course_name}}"
    style: _static/styles.css
