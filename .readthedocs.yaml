# https://docs.readthedocs.io/en/stable/guides/reproducible-builds.html#id2
version: 2

python:
  install:
    - method: uv
      command: sync

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
    nodejs: "22"
  jobs:
    # https://docs.readthedocs.com/platform/stable/build-customization.html#override-the-build-process
    build:
      html:
        # serve assets/links from the version's path, e.g. /en/columbia
        - BASE_URL="$(echo "$READTHEDOCS_CANONICAL_URL" | sed -E 's|^https?://[^/]+||; s|/$||')" make site site_url="$READTHEDOCS_CANONICAL_URL"
        - mkdir -p "$READTHEDOCS_OUTPUT/html/"
        - cp -r _build/html/. "$READTHEDOCS_OUTPUT/html"
