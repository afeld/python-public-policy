# https://docs.readthedocs.io/en/stable/guides/reproducible-builds.html#id2
version: 2

python:
  install:
    - method: uv
      command: sync

build:
  os: ubuntu-24.04
  tools:
    # should match the minor version in .python-version
    python: "3.13"
    nodejs: "22"
  jobs:
    # https://docs.readthedocs.com/platform/stable/build-customization.html#override-the-build-process
    build:
      html:
        - ./extras/scripts/rtd_build.sh
